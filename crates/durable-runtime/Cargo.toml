[package]
name = "durable-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Built-in `ClassifyError` impls for common client libraries.
reqwest = ["dep:reqwest"]
sqlx = ["dep:sqlx"]

[dependencies]
reqwest = { version = "0.13", default-features = false, optional = true }
sqlx = { workspace = true, optional = true }
durable-spi.workspace = true
durable-sm.workspace = true
async-trait.workspace = true
chrono.workspace = true
futures.workspace = true
parking_lot.workspace = true
rand.workspace = true
rand_chacha.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
durable-memory.workspace = true
durable-testkit.workspace = true
reqwest = { version = "0.13", default-features = false }
wiremock = "0.6"
sqlx.workspace = true

[[test]]
name = "classify_reqwest"
required-features = ["reqwest"]

[[test]]
name = "classify_sqlx"
required-features = ["sqlx"]
