# The whole suite, as `./ci.sh` runs it locally: fmt, clippy, the Rust tests
# (Postgres/Redis through testcontainers), the TypeScript SDK and its
# example (Postgres/Redis containers started by scripts/with-servers.sh).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            durable-workflow-ts/package-lock.json
            examples/typescript-onboarding/package-lock.json
      - run: ./ci.sh

  # The Rust workspace through Bazel (docs/bazel.md), next to the Cargo job above.
  # Both must pass: Cargo stays the source of truth, and this job proves the
  # BUILD files and MODULE.bazel.lock still agree with Cargo.toml / Cargo.lock.
  bazel:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: bazel-contrib/setup-bazel@f34d6a05eae3c24acab7fa54587492daeaeffdab # 0.19.2
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-${{ github.job }}
          repository-cache: true
      # Clippy (warnings are errors) on every crate, then every test, including the
      # Postgres/Redis suites (Docker is available on the runner).
      - run: bazel build --config=ci --config=clippy //...
      - run: bazel test --config=ci //...
