# The whole suite, as `./ci.sh` runs it locally: fmt, clippy, the Rust tests
# (Postgres/Redis through testcontainers), the TypeScript SDK and its
# example with pnpm (Postgres/Redis containers started by scripts/with-servers.sh).
#
# This is the pull-request stage: one target (x86_64-unknown-linux-gnu), so a
# PR gets a fast answer. Pushes to main also build the TypeScript addon on
# Linux x64, macOS arm64 and Windows x64, and release tags on every target:
# see typescript-release.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly: the bazel job reruns every test instead of trusting cached results, so a
  # changed postgres/redis image or a flaky test still shows up.
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Coloured logs: the runner is not a terminal, so tools would otherwise print plain
# text. Cargo and clippy read CARGO_TERM_COLOR (ci.sh passes it on to the test
# binaries); Node tools (pnpm, Vitest, tsdown) read FORCE_COLOR; Bazel takes
# --color=yes from `--config=ci` in .bazelrc.
env:
  CARGO_TERM_COLOR: always
  FORCE_COLOR: "1"

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # pnpm, at the version in package.json `packageManager`.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: ./ci.sh

  # The Rust workspace and the TypeScript SDK through Bazel (docs/bazel.md), next to
  # the Cargo/pnpm job above. Both must pass: Cargo and pnpm stay the source of truth,
  # and this job proves the BUILD files and MODULE.bazel.lock still agree with
  # Cargo.toml / Cargo.lock and pnpm-lock.yaml.
  bazel:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # BuildBuddy remote cache and results UI (docs/bazel.md). Pushes to main write
      # the cache with a read-write key; pull requests only read it, with a read-only
      # key, so a PR cannot put bad entries in the cache main and other PRs use. Forks
      # get no secrets: the key is empty and the job uses the GitHub disk cache.
      BUILDBUDDY_API_KEY: ${{ github.event_name == 'push' && secrets.BUILDBUDDY_API_KEY || secrets.BUILDBUDDY_READONLY_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: bazel-contrib/setup-bazel@f34d6a05eae3c24acab7fa54587492daeaeffdab # 0.19.2
        with:
          bazelisk-cache: true
          # Only without BuildBuddy: no point storing the same blobs twice.
          disk-cache: ${{ env.BUILDBUDDY_API_KEY == '' && format('{0}-{1}', github.workflow, github.job) || false }}
          repository-cache: true
      # user.bazelrc is git-ignored and imported last by .bazelrc. --config=ci goes in
      # first, not on the command line: the preset's :ci flags (tools/preset.bazelrc) must
      # come before the BuildBuddy config, which decides whether this run writes the cache.
      - name: Configure Bazel
        run: |
          echo "common --config=ci" > user.bazelrc
          if [ -n "$BUILDBUDDY_API_KEY" ]; then
            config=buildbuddy-readonly
            if [ "$GITHUB_EVENT_NAME" = push ]; then config=buildbuddy; fi
            cat >> user.bazelrc <<EOF
          common --config=$config
          common --remote_header=x-buildbuddy-api-key=$BUILDBUDDY_API_KEY
          common --bes_header=x-buildbuddy-api-key=$BUILDBUDDY_API_KEY
          EOF
          fi
      # Formatting (rustfmt, shfmt, buildifier), then the rules_lint linters (clippy,
      # shellcheck, buildifier; any finding fails) on every target, then every test,
      # including the Postgres/Redis suites (Docker is available on the runner).
      - run: bazel run //:format.check
      - run: bazel build --config=lint //...
      - run: bazel test ${{ github.event_name == 'schedule' && '--nocache_test_results' || '' }} //...
