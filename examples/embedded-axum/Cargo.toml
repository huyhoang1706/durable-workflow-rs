[package]
name = "embedded-axum"
version = "0.0.0"
edition.workspace = true
publish = false

[dependencies]
durable-workflow = { path = "../../durable-workflow-rs", features = ["postgres", "redis"] }
durable-api = { path = "../../crates/durable-api" }
